services:
  redis:
    image: redis:latest
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - default

  scheduler:
    build: .
    depends_on:
      - redis
    environment:
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - SENTRY_DNS=${SENTRY_DNS:-}
    healthcheck:
      test:
        ["CMD-SHELL", "curl -f http://localhost:3000/api/v1/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    ports:
      - "8000:8000"
    restart: on-failure
    networks:
      - default

networks:
  default:
    external: true
    name: hichbox_dev_network

volumes:
  redis-data:
