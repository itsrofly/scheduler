services:
  redis:
    image: redis:latest
    profiles: ["local"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - default

  control-flow:
    build: .
    profiles: ["only-service", "local"]
    environment:
      - REDIS_URL=${REDIS_URL:-"rediss://"}
      - SENTRY_DNS=${SENTRY_DNS:-}
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/api/v1/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    #ports:
    #  - "3000:3000"
    restart: on-failure
    networks:
      - default

networks:
  default:
    external: true
    name: hichbox_dev_network

volumes:
  redis-data:
