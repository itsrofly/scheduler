services:
  api:
    image: scheduler/api
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    depends_on:
      redis:
        condition: service_healthy
      loki:
        condition: service_started
    ports:
      - 8000:8000
    environment:
      REDIS_URL: redis://redis:6379
      LOKI_URL: http://loki:3100
      API_TOKEN_KEY: ${API_TOKEN_KEY:?} # Use openssl rand -hex 32

    healthcheck:
      test: >
        sh -c "wget --spider --quiet http://127.0.0.1:8000/api/v1/health"
      interval: 10s
      timeout: 3s
      retries: 5

  tests:
    image: scheduler/tests
    build:
      context: .
      dockerfile: tests/integration/Dockerfile
    depends_on:
      api:
        condition: service_healthy
    environment:
      HOSTNAME: tests
      SCHEDULER_URL: http://api:8000
      SCHEDULER_TOKEN_KEY: ${API_TOKEN_KEY:?}

  redis:
    image: redis:latest
    volumes:
      - redis-data:/data
    healthcheck:
      test: [ 'CMD', 'redis-cli', 'ping' ]
      interval: 10s
      timeout: 3s
      retries: 5

  loki:
    image: grafana/loki:latest
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - loki_data:/loki
