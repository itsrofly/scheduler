version: '3.8'

services:
  scheduler:
    build: .
    ports:
      - 8000:8000
    environment:
      REDIS_URL: redis://redis:6379
      LOKI_URL: http://loki:3100
      API_TOKEN_KEY: ${API_TOKEN_KEY:?} # Use openssl rand -hex 32

    healthcheck:
      test: >
        sh -c "curl -f http://localhost:8000/api/v1/health"
      interval: 20s
      timeout: 5s
      retries: 3

  redis:
    image: redis:latest
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5

  loki:
    image: grafana/loki:latest
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - loki_data:/loki

  # grafana:
