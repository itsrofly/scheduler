version: "3.8"

services:
  control-flow:
    build:
      context: .
      dockerfile: Dockerfile
    image: control-flow:latest
    env_file:
      - ./src/.env
    ports:
      - "3000:3000"
    healthcheck:
      test:
        ["CMD-SHELL", "curl -f http://localhost:3000/api/v1/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: on-failure
