name: Release and Deploy

on:
  push:
    branches:
      - release/dev

jobs:
  release:
    name: Create Release Tag
    runs-on: ubuntu-latest
    outputs:
      new_version: ${{ steps.version.outputs.new_version }}
      latest_tag: ${{ steps.version.outputs.latest_tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Required to access all tags

      - name: Determine next version
        id: version
        run: |
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "development-v0.0.0")
          LATEST_TAG=$(echo "$LATEST_TAG" | sed 's/.*-v//; s/^v//')
          if [[ ! "$LATEST_TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            LATEST_TAG="0.0.0"
          fi

          MAJOR=$(echo $LATEST_TAG | cut -d. -f1)
          MINOR=$(echo $LATEST_TAG | cut -d. -f2)
          PATCH=$(echo $LATEST_TAG | cut -d. -f3)

          COMMIT_TITLE=$(git log -1 --pretty=%s)

          if [[ "$COMMIT_TITLE" =~ [Ff]ix ]]; then PATCH=$((PATCH + 1)); fi
          if [[ "$COMMIT_TITLE" =~ [Ff]eature ]]; then MINOR=$((MINOR + 1)); fi
          if [[ "$COMMIT_TITLE" =~ [Mm]ajor ]]; then MAJOR=$((MAJOR + 1)); fi

          NEW_VERSION="$MAJOR.$MINOR.$PATCH"

          echo "latest_tag=$LATEST_TAG" >> $GITHUB_OUTPUT
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "commit_title=$COMMIT_TITLE" >> $GITHUB_ENV

      - name: Create GitHub release if version changed
        if: steps.version.outputs.new_version != steps.version.outputs.latest_tag
        uses: softprops/action-gh-release@v2
        with:
          tag_name: development-v${{ steps.version.outputs.new_version }}
          name: development-v${{ steps.version.outputs.new_version }}
          body: ${{ env.commit_title }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy:
    name: Deploy to GitLab Container Registry
    runs-on: ubuntu-latest
    needs: release
    if: needs.release.outputs.new_version != needs.release.outputs.latest_tag
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitLab Container Registry
        run: echo "${{ secrets.DOCKER_REGISTRY_PASSWORD }}" | docker login ${{ secrets.DOCKER_REGISTRY }} -u "${{ secrets.DOCKER_REGISTRY_USER }}" --password-stdin

      - name: Build and push Docker image
        run: |
          git fetch --tags --force origin
          git checkout -f "development-v${{ needs.release.outputs.new_version }}"
          docker build -t "${{ secrets.DOCKER_REGISTRY }}/${{ github.repository }}:development-v${{ needs.release.outputs.new_version }}" .
          docker push "${{ secrets.DOCKER_REGISTRY }}/${{ github.repository }}:development-v${{ needs.release.outputs.new_version }}"
